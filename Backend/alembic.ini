# Alembic configuration.
#
# The database URL is intentionally NOT written here: this file is committed,
# and a DSN contains a password. `migrations/env.py` reads it from Settings,
# which reads it from the environment.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Timestamped, descriptive revision filenames: `20260905_1830-a1b2c3_add_users.py`
# sorts chronologically in the directory listing, which a bare hash does not.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

# Una revisión recién generada pasa por las mismas herramientas que el resto
# del código, en el mismo orden que `make format`. `ruff_fix` no estaba, y sin
# él Alembic escribe sus imports en un orden que el linter rechaza: la
# migración nacía rompiendo CI y había que arreglarla a mano cada vez.
[post_write_hooks]
hooks = ruff_format,ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
# Solo la regla de ordenación (I). Un `--fix` completo también borraría los
# imports que la plantilla deja preparados y que una migración escrita a mano
# va a usar en cuanto tenga cuerpo. Reordenar no quita nada.
ruff_fix.options = check --fix --select I REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
