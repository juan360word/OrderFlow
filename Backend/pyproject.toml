[project]
name = "orderflow"
version = "0.1.0"
description = "Distributed Order Processing Platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.2",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orderflow"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Curated rule set: correctness first, then the security (S) and async (ASYNC)
# rules that matter most for a service handling money and credentials.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (import ordering)
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # comprehensions
    "S",        # flake8-bandit (security)
    "ASYNC",    # async correctness
    "T20",      # no stray print()
    "SIM",      # simplify
    "RUF",
]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the documented idiom.
    "S101",  # assert is the point of pytest.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]  # hardcoded test passwords are fine.
"migrations/*" = ["E501", "N999"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
mypy_path = "src"
packages = ["orderflow"]
warn_unreachable = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Tests must share the loop their session-scoped fixtures were created on:
# an asyncpg connection is bound to the loop that opened it, and using it from
# another loop fails with "attached to a different loop".
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL database",
    "concurrency: spawns real concurrent database sessions",
]

[tool.coverage.run]
source = ["src/orderflow"]
branch = true
